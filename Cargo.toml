[package]
name = "rust-grpc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.4"
anyhow = "1.0.104"
tonic-tracing-opentelemetry = "0.42.1"
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry-semantic-conventions = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
  "trace",
  "grpc-tonic",
  "tls-ring",
  "tls-roots",
] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3.23"
shuttle-runtime = "0.57.0"
async-trait = "0.1.92"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
gh-workflow = "0.9.0"
